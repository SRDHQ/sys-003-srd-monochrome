# SRD Monochrome — hyprtoolkit colours (hyprlauncher and other hyprtoolkit apps)
# Matches the kitty theme (kitty/srd-monochrome.conf, D-090), the SWITCHBOARD console,
# EXCHANGE LINES and the Obsidian theme (D-091): black background, soft white text, kitty greys,
# no hue, square corners, monospace, greyscale app icons. Installed as ~/.config/hypr/hyprtoolkit.conf.

background       = rgba(000000ff)
base             = rgba(000000ff)
alternate_base   = rgba(1c1c1cff)
text             = rgba(e6e6e6ff)
bright_text      = rgba(ffffffff)
link_text        = rgba(bcbcbcff)
accent           = rgba(ffffffff)  # frame; the selected row is a dimmed copy
accent_secondary = rgba(767676ff)

font_family           = monospace
font_family_monospace = monospace

# Built by hyprtoolkit/mono-icons.py into ~/.local/share/icons/SRD-Mono
icon_theme = SRD-Mono

rounding_large = 0
rounding_small = 0
