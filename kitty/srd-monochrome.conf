# SRD Monochrome — kitty colours (D-090)
# Black and white to match SRD EXCHANGE and the SWITCHBOARD console: black background, soft white
# text, reverse-video selection, and the 16 terminal colours as distinct greys. Every grey except
# color0 has at least 4.5:1 contrast on black (WCAG 1.4.3). Hue is gone by design: programs that
# colour errors red or additions green show them as lighter or darker greys.

foreground              #e6e6e6
background              #000000
selection_foreground    #000000
selection_background    #e6e6e6
url_color               #bcbcbc
cursor                  #ffffff
cursor_text_color       #000000

active_border_color     #ffffff
inactive_border_color   #3a3a3a
bell_border_color       #ffffff

tab_bar_background      #000000
active_tab_foreground   #000000
active_tab_background   #e6e6e6
inactive_tab_foreground #8a8a8a
inactive_tab_background #000000

# black
color0  #1c1c1c
color8  #767676
# red
color1  #a8a8a8
color9  #c8c8c8
# green
color2  #bcbcbc
color10 #d8d8d8
# yellow
color3  #d0d0d0
color11 #ececec
# blue
color4  #949494
color12 #b2b2b2
# magenta
color5  #9e9e9e
color13 #bcbcbc
# cyan
color6  #c6c6c6
color14 #e0e0e0
# white
color7  #dadada
color15 #ffffff
